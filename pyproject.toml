[project]
name = "agent-eval-bench"
version = "0.1.0"
description = "Reusable evaluation framework for LangChain agents"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai",
    "langsmith",        # LangChain observability + tracing
    "openai>=1.40",
    "pydantic>=2.0",
    "pyyaml",           # YAML scenario files
    "jinja2",           # HTML report templates
    "typer",            # CLI
    "rich",             # pretty terminal output
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
evalbench = "evalbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true
follow_imports = "skip"
